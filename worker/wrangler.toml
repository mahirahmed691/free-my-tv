# The TV's backend (worker/src/index.js). Secrets are set with `npx wrangler secret put <NAME>`, never here:
#   TV_TOKEN   the token the TV sends (also worker_token in config.properties)
#   UKHO_KEY   UKHO Admiralty API, Discovery tier (developer.admiralty.co.uk)
#   ALLOWED_IPS  your home connection: its IPv4 and IPv6 /64, comma separated (a secret: not your IP in git)
name = "freemytv-bff"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
STATIONS = "0451:Mersey,0461:Dee"
TRAINS_CRS = "BKQ"
# football-data.org team id: Manchester United.
FOOTBALL_TEAM = "66"
CALENDAR_TZ = "Europe/London"
# Jumu'ah jamaat at the mosque, when its widget is behind (Wallasey: 1:00 PM from 25 October 2026, as Sakinah has it).
JUMUAH = "13:00"
# Sites on the GitHub card: "Name:BINDING", each binding a monitoring Worker's STATE KV (read only here).
SITES = "Sweet Dezire:SITE_SWEETDEZIRE,RAPIDER:SITE_RAPIDER"
# Your other sites (mahirahmed.link), checked every 15 minutes by the cron below: "Name=https://url|...".
WATCH_SITES = "Link page=https://mahirahmed.link|Blog=https://mahirahmed691.tech|Prolific Digital Tech=https://www.prolificdigitaltech.co.uk|FlickFinder=https://flickfinder-nu.vercel.app|Sakinah=https://www.mysakinah.app|Motiv=https://www.motivcarhire.com|Kiano London=https://kiano.london|KARV'D=https://www.karvd.uk|Blanco Coffee House=https://blancocoffeehouse.com|D Apartment Sylhet=https://www.dapartmentsylhet.com"

# Health (each source's last success and failure) and the answers of sources that allow caching; never UKHO's.
# The id comes from `npx wrangler kv namespace create CACHE`.
[[kv_namespaces]]
binding = "CACHE"
id = "c1db6ca58e7042b99917a72a245a4322"

# The monitoring Workers' last results (sweetdezire ops/uptime-worker, rapider-site ops/site-check-worker).
[[kv_namespaces]]
binding = "SITE_SWEETDEZIRE"
id = "53280a8f602d4196a56560ab957249d9"

[[kv_namespaces]]
binding = "SITE_RAPIDER"
id = "534d27f7ed3e4b91b533c5159895dbc6"
