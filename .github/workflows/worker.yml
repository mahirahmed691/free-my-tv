# Deploys the Worker (worker/) when a push to wirral-setup changes it: its tests first, then wrangler deploy. Secrets
# stay in Cloudflare (wrangler secret put); this needs only CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare
# Workers" on this account) and CLOUDFLARE_ACCOUNT_ID as repository secrets. Without them it runs the tests and stops.
# The repository is public, so GitHub's runners cost no Actions minutes here.
name: Worker

on:
  push:
    branches: [wirral-setup]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.150.0 deploy
